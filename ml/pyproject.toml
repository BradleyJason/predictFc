[project]
name = "predictfc-ml"
version = "0.1.0"
description = "PredictFC ML Pipeline"
authors = [
    {name = "BradleyJason"}
]
requires-python = "^3.11"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "pandas (<3)",
    "mlflow (<3)",
    "dagshub (>=0.6.8,<0.7.0)",
    "dvc (>=3.66.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.5,<0.16.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
