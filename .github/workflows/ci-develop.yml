name: CI — Develop

on:
  push:
    branches: [develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: cd backend && poetry install

      - name: Lint
        run: cd backend && poetry run ruff check . || true

      - name: Tests
        run: |
          if [ -f backend/tests/test_*.py ] || [ -d backend/tests/test_api ]; then
            cd backend && poetry run pytest --cov=app --cov-report=term-missing
          else
            echo "⏭️  No tests yet — skipping"
          fi
        env:
          APP_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: cd ml && poetry install

      - name: Lint ML
        run: cd ml && poetry run ruff check . || true
