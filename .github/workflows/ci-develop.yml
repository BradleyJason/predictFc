name: CI — Develop

on:
  push:
    branches: [develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: cd backend && poetry install --no-root

      - name: Lint
        run: cd backend && poetry run ruff check . || true

      - name: Tests
        run: |
          cd backend
          poetry run pytest --cov=app --cov-report=term-missing; CODE=$?
          if [ $CODE -eq 5 ]; then echo "⏭️ No tests yet"; exit 0; fi
          exit $CODE

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: cd ml && poetry install --no-root

      - name: Lint ML
        run: cd ml && poetry run ruff check . || true
