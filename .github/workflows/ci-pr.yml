name: CI — Pull Request

on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: cd backend && poetry install --no-root

      - name: Lint
        run: cd backend && poetry run ruff check . || true

      - name: Tests + Coverage
        run: |
          cd backend
          poetry run pytest --cov=app --cov-report=term-missing; CODE=$?
          if [ $CODE -eq 5 ]; then echo "⏭️ No tests yet"; exit 0; fi
          exit $CODE
        env:
          APP_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: cd ml && poetry install --no-root

      - name: Lint ML
        run: cd ml && poetry run ruff check . || true

      - name: Tests ML
        run: |
          cd ml
          poetry run pytest; CODE=$?
          if [ $CODE -eq 5 ]; then echo "⏭️ No tests yet"; exit 0; fi
          exit $CODE
